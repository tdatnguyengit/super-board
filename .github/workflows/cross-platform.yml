name: cross-platform

# All offline safety suites run on Linux/macOS. Windows checks the status reader and
# runs the GitLab suites.
# Reused by release.yml so a failed suite prevents the publish job from running.
permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_call:

jobs:
  smoke:
    name: smoke (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Step 1 — proves the script is syntactically valid on this Python
      # version. Catches typing-syntax, f-string, walrus, etc. regressions
      # without needing any runtime state.
      - name: compile super-board-status
        run: python -m py_compile scripts/super-board-status.py

      # Step 2 — exercise the "no config + no active marker + no single
      # config" path of super-board-status.py. Documented to exit 64.
      # Runs in the repo root, where no `.claude/super-board/configs/` exists.
      - name: status — no-config path exits 64
        shell: bash
        run: |
          set +e
          python scripts/super-board-status.py
          ec=$?
          set -e
          if [ "$ec" -ne 64 ]; then
            echo "::error::Expected exit 64 (no config), got $ec"
            exit 1
          fi
          echo "OK: super-board-status.py exited 64 as documented"

      # Step 3 — unit-test the manifest parser against real dispatcher log
      # lines from `scripts/super-board-run.sh`. Catches the class of
      # regression that ships when the parser's regexes drift away from
      # what the dispatcher actually emits.
      - name: status — parser fixture tests
        run: python tests/test_status_parse.py

  # GitLab backend suites (fake glab, no network) on all three OSes. Linux/macOS also run
  # them inside `safety` (run-safety.sh picks up every tests/test-* and tests/test_*);
  # this job adds Windows (Git Bash), which `safety` does not cover.
  gitlab:
    name: gitlab (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      # Bash scripts must keep LF endings on Windows.
      - name: keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: python3 on PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          command -v python3 >/dev/null && exit 0
          mkdir -p "$RUNNER_TEMP/py3"
          printf '#!/usr/bin/env bash\nexec python "$@"\n' > "$RUNNER_TEMP/py3/python3"
          chmod +x "$RUNNER_TEMP/py3/python3"
          echo "$RUNNER_TEMP/py3" >> "$GITHUB_PATH"
      - name: Run the GitLab suites
        shell: bash
        run: |
          shopt -s nullglob
          suites=(tests/test-forge-*.sh tests/test_gitlab_*.py)
          [ "${#suites[@]}" -gt 0 ] || { echo '::error::no GitLab suites found'; exit 1; }
          failed=0
          for s in "${suites[@]}"; do
            echo "::group::$s"
            case "$s" in *.sh) bash "$s" ;; *.py) python3 "$s" ;; esac || { echo "::error::$s failed"; failed=1; }
            echo '::endgroup::'
          done
          exit "$failed"

  safety:
    name: safety (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run every offline safety suite
        env:
          SB_RUNTIME_TEST_ARTIFACTS: ${{ runner.temp }}/runtime-test-evidence
        run: bash tests/run-safety.sh
      - name: Keep runtime test evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-evidence-${{ matrix.os }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/runtime-test-evidence
          if-no-files-found: ignore
          retention-days: 7
